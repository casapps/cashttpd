# cargo-deny policy: license / advisory / bans / sources gate.
# Run inside casjaysdev/rust:latest — see AI.md PART 11 "License Compliance".

[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "BSL-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "OpenSSL",
  # Mozilla CA root-store data shipped by `webpki-roots` (server::tls ACME
  # client's HTTPS trust store) — a permissive data-attribution license,
  # not copyleft; see AI.md PART 11 "License Allowlist (default)".
  "CDLA-Permissive-2.0",
]
# Explicit denylist (AI.md PART 11 "License Denylist"). The allowlist above
# already rejects anything unlisted, so these entries are belt-and-braces:
# they make the refusal reason self-documenting and stop a copyleft license
# from being waved through by a future careless allowlist edit. Every one of
# these breaks the MIT single-static-binary deliverable, so admitting one
# requires the AI.md PART 11 "IDEA.md Exception Path", not a deny.toml edit.
deny = [
  # Strong copyleft - static linking relicenses the whole binary away from MIT.
  "GPL-2.0",
  "GPL-3.0",
  # Strong copyleft plus a network-use clause.
  "AGPL-1.0",
  "AGPL-3.0",
  # LGPL section 6 under static linking requires shipping object files or a
  # written relink offer alongside the binary.
  "LGPL-2.0",
  "LGPL-2.1",
  "LGPL-3.0",
  # Service-source copyleft; treated like AGPL here.
  "SSPL-1.0",
  # Source-available with commercial-use restrictions; not OSI-approved.
  "Commons-Clause",
  "BUSL-1.1",
  "Elastic-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
