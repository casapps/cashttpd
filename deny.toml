# cargo-deny policy: license / advisory / bans / sources gate.
# Run inside casjaysdev/rust:latest — see AI.md PART 11 "License Compliance".

[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "BSL-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "OpenSSL",
  # Mozilla CA root-store data shipped by `webpki-roots` (server::tls ACME
  # client's HTTPS trust store) — a permissive data-attribution license,
  # not copyleft; see AI.md PART 11 "License Allowlist (default)".
  "CDLA-Permissive-2.0",
]
# AI.md PART 11 "License Denylist": every license listed there (GPL-2.0/3.0,
# AGPL-1.0/3.0, LGPL-2.0/2.1/3.0, SSPL-1.0, Commons-Clause, BUSL-1.1,
# Elastic-2.0 — each breaking the MIT single-static-binary deliverable under
# static linking or a network-use/source-available clause) is refused
# implicitly: cargo-deny's `[licenses] deny` key was removed upstream
# (EmbarkStudios/cargo-deny#611 — confirmed against this project's pinned
# casjaysdev/rust:latest cargo-deny, which errors on the deprecated key) in
# favor of the allowlist above being exhaustive — anything not explicitly
# allowed is denied by default. Admitting one of these requires the AI.md
# PART 11 "IDEA.md Exception Path", not a deny.toml edit.
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
