# cargo-deny policy: license / advisory / bans / sources gate.
# Run inside casjaysdev/rust:latest — see AI.md PART 11 "License Compliance".

[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "BSL-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "OpenSSL",
  # Mozilla CA root-store data shipped by `webpki-roots` (server::tls ACME
  # client's HTTPS trust store) — a permissive data-attribution license,
  # not copyleft; see AI.md PART 11 "License Allowlist (default)".
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
