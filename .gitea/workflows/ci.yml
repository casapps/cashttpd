name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly Monday 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_cargo_lock: ${{ steps.detect.outputs.has_cargo_lock }}
      has_dockerfile: ${{ steps.detect.outputs.has_dockerfile }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - id: detect
        # `hashFiles()` cannot be used in a job-level `if:` — that condition
        # is evaluated before a runner is assigned and the repo checked out,
        # so it can never see the working tree. Detect file presence here
        # instead and pass the result via job outputs.
        run: |
          echo "has_cargo_lock=$([ -f Cargo.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_dockerfile=$([ -f docker/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    # `.cargo/config.toml` attaches `-C target-feature=+crt-static` to the
    # musl targets; a bare `cargo` invocation with no explicit target applies
    # those rustflags to host build artifacts too here (the container's host
    # triple already is x86_64-unknown-linux-musl), which makes proc-macro
    # crates (a dynamic library by definition) impossible to produce —
    # "cannot produce proc-macro ... as the target does not support these
    # crate types". Naming the target explicitly keeps target rustflags off
    # host units, matching the Makefile's `CARGO_BUILD_TARGET` for local
    # Docker builds (see Makefile's own comment for the full explanation).
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    # See the `lint` job's comment above for why this is needed.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo test --workspace --all-features

  coverage:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    # See the `lint` job's comment above for why this is needed.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      # IDEA.md does not declare a coverage threshold, so the PART 8 default
      # of 60% applies. Using `cargo llvm-cov` rather than `cargo tarpaulin`
      # — both are pre-installed in casjaysdev/rust:latest and AI.md PART 8
      # permits either, but tarpaulin's ptrace-based instrumentation needs
      # to disable ASLR via `personality()`, which fails with EPERM inside
      # a GitHub Actions `container:`-scoped job (confirmed via a real CI
      # run: "ASLR disable failed: EPERM: Operation not permitted").
      # llvm-cov uses source-based instrumentation instead and needs no
      # such syscall.
      - run: cargo llvm-cov --workspace --all-features --fail-under-lines 60

  docs:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    # See the `lint` job's comment above for why this is needed.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo doc --workspace --no-deps

  license-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: cargo deny (inside casjaysdev/rust:latest)
        # `casjaysdev/rust:latest` ships a default ENTRYPOINT (an unrelated
        # SMTP-config startup script) that silently intercepts any ad hoc
        # `docker run` that doesn't explicitly override it — confirmed via a
        # real CI run ("Executing entrypoint script for alpine" / "Configuring
        # smtp server", exit code 1). `--entrypoint sh -c '...'` bypasses it.
        run: |
          docker run --rm \
            --name "$(basename "$GITHUB_REPOSITORY")-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)" \
            --entrypoint sh \
            -v "$PWD":/work -w /work casjaysdev/rust:latest \
            -c 'cargo deny check licenses advisories bans sources'
      # `cargo-about` is part of casjaysdev/rust:latest (verified directly
      # against the image: /usr/local/bin/cargo-about is present), so this
      # runs straight against the maintained toolchain image — no local
      # extension image needed (AI.md "Toolchain Image": never create
      # docker/Dockerfile.build for Rust).
      - name: Attribution-drift check
        run: |
          set -euo pipefail
          docker run --rm \
            --name "$(basename "$GITHUB_REPOSITORY")-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)" \
            --entrypoint sh \
            -v "$PWD":/work -w /work casjaysdev/rust:latest \
            -c 'cargo about generate about.hbs' > LICENSE.generated.md
          sed -n '/<!-- GENERATED:/,$p' LICENSE.md > LICENSE.committed-generated.md
          # Some upstream crates (e.g. mime_guess) ship an embedded LICENSE
          # file with CRLF line endings, which cargo-about copies verbatim;
          # `.gitattributes`' `* text=auto` normalizes CRLF to LF on commit,
          # so the checked-out committed file never has them. Strip \r from
          # both sides before diffing so that normalization isn't reported
          # as drift.
          diff <(tr -d '\r' < LICENSE.committed-generated.md) <(tr -d '\r' < LICENSE.generated.md)

  build:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    # See the `lint` job's comment above for why this is needed.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo build --release

  upload-artifacts:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cashttpd-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/cashttpd
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # required: truffleHog needs full history
          fetch-depth: 0
      - name: Determine scan range
        id: scan-range
        # `github.event.before` is the all-zero SHA on a new branch's first
        # push and is unset entirely on `schedule` runs, which breaks
        # TruffleHog's diff scan. Resolve base/head explicitly per event
        # type instead of passing the raw context values straight through.
        run: |
          zero="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "$zero" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11  # v3.96.0
        with:
          base: ${{ steps.scan-range.outputs.base }}
          head: ${{ steps.scan-range.outputs.head }}
          extra_args: --results=verified,unknown

  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Verify all third-party actions are pinned to a 40-char SHA
        run: |
          set -eo pipefail
          # `@(v?[0-9]|main|master)` also matches a real 40-char SHA that
          # happens to start with a decimal digit (e.g. `@76071ef0...`),
          # producing false positives — confirmed via a real CI run.
          # Extract each `uses:` ref and reject only refs that are NOT a
          # full 40-char hex SHA.
          bad=$(grep -RhnoE '^\s*uses:\s*[^@]+@[^[:space:]]+' .github/ .gitea/ .forgejo/ 2>/dev/null \
                | grep -vE '@[0-9a-fA-F]{40}$' || true)
          if [[ -n "$bad" ]]; then
            echo "::error::Unpinned actions found (must be 40-char SHAs):"
            echo "$bad"
            exit 1
          fi

  vuln-scan:
    needs: detect
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.has_cargo_lock == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: cargo audit (inside casjaysdev/rust:latest)
        # `casjaysdev/rust:latest`'s default ENTRYPOINT intercepts ad hoc
        # `docker run` invocations unless explicitly overridden — see the
        # identical fix and rationale in the license-compliance job above.
        run: |
          IMAGE="casjaysdev/rust:latest"
          docker run --rm -i \
            --name "$(basename "$GITHUB_REPOSITORY")-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)" \
            --entrypoint sh \
            -v "$PWD":/work -w /work "$IMAGE" -c 'cargo audit'

  image-scan:
    needs: detect
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.has_dockerfile == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - name: Build local image for scanning
        run: |
          docker build -f docker/Dockerfile -t scan-target:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: scan-target:ci
          severity: CRITICAL,HIGH
          exit-code: '1'

  publish-devel-image:
    # `docker/docker-compose.dev.yml` runs the `:devel` tag, so the default
    # branch publishes it after the image scan passes. Tagged releases
    # publish `:latest` / `:{version}` from release.yml instead.
    needs:
      - detect
      - test
      - image-scan
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.detect.outputs.has_dockerfile == 'true'
    runs-on: ubuntu-latest
    permissions:
      # push the devel image to the provider's container registry
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Resolve registry, image name, and build metadata
        id: image
        # No hardcoded org, project name, or registry value (AI.md PART 5
        # "Portability Rule") — everything is derived from the provider
        # context so the workflow keeps working after a fork. GitHub's own
        # container registry is ghcr.io; every other provider (Gitea,
        # Forgejo) serves its package registry from the instance host.
        run: |
          set -euo pipefail
          host="$(printf '%s' "${{ github.server_url }}" | sed -E 's#^https?://##; s#/$##')"
          case "$host" in
            github.com) registry="ghcr.io" ;;
            *)          registry="$host" ;;
          esac
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          name="$(printf '%s' "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          if [ -s release.txt ]; then
            version="$(tr -d '[:space:]' < release.txt)"
          else
            version="0.0.0"
          fi
          # Captured ONCE; BUILD_DATE is derived from it, never independently
          # captured (AI.md PART 6 "Build Metadata").
          build_epoch="$(date -u +%s)"
          {
            echo "registry=$registry"
            echo "image=$registry/$owner/$name"
            echo "version=$version"
            echo "build_epoch=$build_epoch"
            echo "build_date=$(date -u -d "@$build_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # The whole builder stage is QEMU-emulated for a foreign target
      # platform (casjaysdev/rust:latest has no cross-compile linker
      # installed), same as the Alpine runtime stage.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        id: meta
        with:
          images: ${{ steps.image.outputs.image }}
          annotations: |
            maintainer=${{ github.repository_owner }} <${{ github.repository_owner }}@casjay.pro>
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.base.name=${{ github.event.repository.name }}
            org.opencontainers.image.description=Containerized version of ${{ github.event.repository.name }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.documentation=${{ github.event.repository.html_url }}
            org.opencontainers.image.vcs-type=Git
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ steps.image.outputs.build_date }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.schema-version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.github.containers.toolbox=false

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:devel
          build-args: |
            PROJECT_ORG=${{ github.repository_owner }}
            PROJECT_NAME=${{ github.event.repository.name }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # annotations only — no LABEL blocks and no label output
          # (AI.md PART 5 "OCI Annotations (No LABEL Policy)")
          labels: ""
          # prevents a spurious unknown/unknown platform entry in the
          # manifest list
          provenance: false
