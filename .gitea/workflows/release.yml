name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-gnullvm
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # commit metadata (COMMIT_ID below) needs the real HEAD sha
          fetch-depth: 0

      - name: Build release binary
        # Single captured time source (AI.md PART 6 "Build Metadata"):
        # BUILD_EPOCH is captured once per job and, together with COMMIT_ID,
        # exported for build.rs to embed via APP_BUILD_EPOCH/APP_COMMIT_ID.
        run: |
          set -euo pipefail
          BUILD_EPOCH="$(date -u +%s)"
          export BUILD_EPOCH
          export COMMIT_ID="${GITHUB_SHA}"
          cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p binaries
          case "$TARGET" in
            x86_64-unknown-linux-musl)  ARTIFACT="cashttpd-linux-amd64" ;;
            aarch64-unknown-linux-musl) ARTIFACT="cashttpd-linux-arm64" ;;
            x86_64-pc-windows-gnu)      ARTIFACT="cashttpd-windows-amd64.exe" ;;
            aarch64-pc-windows-gnullvm) ARTIFACT="cashttpd-windows-arm64.exe" ;;
            x86_64-apple-darwin)        ARTIFACT="cashttpd-darwin-amd64" ;;
            aarch64-apple-darwin)       ARTIFACT="cashttpd-darwin-arm64" ;;
          esac
          case "$TARGET" in
            *-pc-windows-*) BIN="cashttpd.exe" ;;
            *)              BIN="cashttpd" ;;
          esac
          cp "target/$TARGET/release/$BIN" "binaries/$ARTIFACT"

      - name: Verify static linkage
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            *-unknown-linux-musl)
              # musl static-pie binaries self-reference their own musl
              # loader stub in `ldd` output (e.g. `/lib/ld-musl-x86_64.so.1
              # (0x...)`) even though they have no external dynamic
              # dependency — `file` is the authoritative static-linkage
              # check here; `ldd` is captured for the log but not gated on.
              ldd "target/$TARGET/release/cashttpd" 2>&1 || true
              file "target/$TARGET/release/cashttpd" | grep -qE 'static-pie linked|statically linked'
              ;;
            *-apple-darwin)
              otool -L "target/$TARGET/release/cashttpd"
              ;;
            *-pc-windows-*)
              dumpbin /dependents "target/$TARGET/release/cashttpd.exe"
              ;;
          esac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cashttpd-${{ matrix.target }}
          path: binaries/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # create GitHub release + upload assets
      contents: write
      # OIDC token for cosign / attest-build-provenance
      id-token: write
      # GitHub artifact attestations (SBOM, provenance)
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # required: full history needed to inspect and push tags
          fetch-depth: 0

      - name: Ensure release tag
        run: |
          set -euo pipefail
          ref="${{ github.ref }}"
          if [[ "$ref" != refs/tags/* ]]; then
            echo "::error::release.yml triggered on non-tag ref '$ref'. Releases require a tag push (refs/tags/v...)."
            exit 1
          fi
          tag="${ref#refs/tags/}"
          if printf '%s' "$tag" | grep -qP '[[:space:][:cntrl:]]'; then
            echo "::error::Tag '$tag' contains whitespace or control characters and is not a valid GitHub tag name."
            exit 1
          fi
          git tag -d "$tag" 2>/dev/null || true
          git push origin ":refs/tags/$tag" 2>/dev/null || true
          git tag "$tag"
          git push origin "refs/tags/$tag"

      - name: Download all release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v6.0.0
        with:
          path: binaries
          pattern: cashttpd-*
          merge-multiple: true

      - name: Generate SBOM
        # `cargo-cyclonedx` is part of casjaysdev/rust:latest (verified
        # directly against the image: /usr/local/bin/cargo-cyclonedx is
        # present), so this runs straight against the maintained toolchain
        # image — no local extension image needed (AI.md "Toolchain Image":
        # never create docker/Dockerfile.build for Rust). Same default-
        # ENTRYPOINT interception issue as ci.yml's license-compliance job,
        # hence the identical `--entrypoint sh` override.
        run: |
          docker run --rm \
            --name "$(basename "$GITHUB_REPOSITORY")-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)" \
            --entrypoint sh \
            -v "$PWD":/work -w /work casjaysdev/rust:latest -c 'cargo cyclonedx --format json'
          cp bom.json "binaries/cashttpd-bom.json"

      - name: Generate aggregate checksums
        # Two aggregate checksum files covering every published artifact
        # (AI.md PART 2 "Binary Model" / PART 5 "Release Artifacts") — never
        # per-artifact sidecar files.
        run: |
          set -euo pipefail
          cd binaries
          sha256sum * > sha256.txt
          sha512sum * > sha512.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes \
            binaries/*

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068c3c56  # v3.0.0
        with:
          subject-path: binaries/cashttpd-*

  publish-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # push the runtime image to the provider's container registry
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # the image revision annotation needs the real HEAD sha
          fetch-depth: 0

      - name: Resolve registry, image name, and build metadata
        id: image
        # No hardcoded org, project name, or registry value (AI.md PART 5
        # "Portability Rule") — everything is derived from the provider
        # context so the workflow keeps working after a fork. GitHub's own
        # container registry is ghcr.io; every other provider (Gitea,
        # Forgejo) serves its package registry from the instance host.
        run: |
          set -euo pipefail
          host="$(printf '%s' "${{ github.server_url }}" | sed -E 's#^https?://##; s#/$##')"
          case "$host" in
            github.com) registry="ghcr.io" ;;
            *)          registry="$host" ;;
          esac
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          name="$(printf '%s' "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          # release.txt wins when present (AI.md PART 10 "Version precedence")
          if [ -s release.txt ]; then
            version="$(tr -d '[:space:]' < release.txt)"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          # Captured ONCE; BUILD_DATE is derived from it, never independently
          # captured (AI.md PART 6 "Build Metadata").
          build_epoch="$(date -u +%s)"
          {
            echo "registry=$registry"
            echo "image=$registry/$owner/$name"
            echo "version=$version"
            echo "build_epoch=$build_epoch"
            echo "build_date=$(date -u -d "@$build_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # The whole builder stage is QEMU-emulated for a foreign target
      # platform (casjaysdev/rust:latest has no cross-compile linker
      # installed), same as the Alpine runtime stage.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        id: meta
        with:
          images: ${{ steps.image.outputs.image }}
          annotations: |
            maintainer=${{ github.repository_owner }} <${{ github.repository_owner }}@casjay.pro>
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.base.name=${{ github.event.repository.name }}
            org.opencontainers.image.description=Containerized version of ${{ github.event.repository.name }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.documentation=${{ github.event.repository.html_url }}
            org.opencontainers.image.vcs-type=Git
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ steps.image.outputs.build_date }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.schema-version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.github.containers.toolbox=false

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.version }}
          build-args: |
            BUILD_EPOCH=${{ steps.image.outputs.build_epoch }}
            COMMIT_ID=${{ github.sha }}
            PROJECT_ORG=${{ github.repository_owner }}
            PROJECT_NAME=${{ github.event.repository.name }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # annotations only — no LABEL blocks and no label output
          # (AI.md PART 5 "OCI Annotations (No LABEL Policy)")
          labels: ""
          # prevents a spurious unknown/unknown platform entry in the
          # manifest list; binary provenance is attested separately above
          provenance: false
