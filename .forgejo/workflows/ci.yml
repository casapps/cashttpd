name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly Monday 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_cargo_lock: ${{ steps.detect.outputs.has_cargo_lock }}
      has_dockerfile: ${{ steps.detect.outputs.has_dockerfile }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - id: detect
        # `hashFiles()` cannot be used in a job-level `if:` — that condition
        # is evaluated before a runner is assigned and the repo checked out,
        # so it can never see the working tree. Detect file presence here
        # instead and pass the result via job outputs.
        run: |
          echo "has_cargo_lock=$([ -f Cargo.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_dockerfile=$([ -f docker/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo test --workspace --all-features

  coverage:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      # IDEA.md does not declare a coverage threshold, so the PART 8 default
      # of 60% applies. Using `cargo llvm-cov` rather than `cargo tarpaulin`
      # — both are pre-installed in casjaysdev/rust:latest and AI.md PART 8
      # permits either, but tarpaulin's ptrace-based instrumentation needs
      # to disable ASLR via `personality()`, which fails with EPERM inside
      # a GitHub Actions `container:`-scoped job (confirmed via a real CI
      # run: "ASLR disable failed: EPERM: Operation not permitted").
      # llvm-cov uses source-based instrumentation instead and needs no
      # such syscall.
      - run: cargo llvm-cov --workspace --all-features --fail-under-lines 60

  docs:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo doc --workspace --no-deps

  license-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: cargo deny (inside casjaysdev/rust:latest)
        # `casjaysdev/rust:latest` ships a default ENTRYPOINT (an unrelated
        # SMTP-config startup script) that silently intercepts any ad hoc
        # `docker run` that doesn't explicitly override it — confirmed via a
        # real CI run ("Executing entrypoint script for alpine" / "Configuring
        # smtp server", exit code 1). `--entrypoint sh -c '...'` bypasses it.
        run: |
          docker run --rm \
            --name "$(basename "$GITHUB_REPOSITORY")-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)" \
            --entrypoint sh \
            -v "$PWD":/work -w /work casjaysdev/rust:latest \
            -c 'cargo deny check licenses advisories bans sources'
      # `cargo-about` is not part of casjaysdev/rust:latest (verified: neither
      # the binary nor `cargo binstall` is present in that image), so this
      # step builds the local extension image (docker/Dockerfile.build — see
      # that file's header comment for why it exists) to run the
      # attribution-drift check.
      - name: Build toolchain extension image (cargo-about)
        run: docker build -f docker/Dockerfile.build -t cashttpd-toolchain:ci .
      - name: Attribution-drift check
        run: |
          set -euo pipefail
          docker run --rm \
            --name "$(basename "$GITHUB_REPOSITORY")-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)" \
            --entrypoint sh \
            -v "$PWD":/work -w /work cashttpd-toolchain:ci \
            -c 'cargo about generate about.hbs' > LICENSE.generated.md
          sed -n '/<!-- GENERATED:/,$p' LICENSE.md > LICENSE.committed-generated.md
          # Some upstream crates (e.g. mime_guess) ship an embedded LICENSE
          # file with CRLF line endings, which cargo-about copies verbatim;
          # `.gitattributes`' `* text=auto` normalizes CRLF to LF on commit,
          # so the checked-out committed file never has them. Strip \r from
          # both sides before diffing so that normalization isn't reported
          # as drift.
          diff <(tr -d '\r' < LICENSE.committed-generated.md) <(tr -d '\r' < LICENSE.generated.md)

  build:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo build --release

  upload-artifacts:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/rust:latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cashttpd-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/cashttpd
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # required: truffleHog needs full history
          fetch-depth: 0
      - name: Determine scan range
        id: scan-range
        # `github.event.before` is the all-zero SHA on a new branch's first
        # push and is unset entirely on `schedule` runs, which breaks
        # TruffleHog's diff scan. Resolve base/head explicitly per event
        # type instead of passing the raw context values straight through.
        run: |
          zero="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "$zero" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11  # v3.96.0
        with:
          base: ${{ steps.scan-range.outputs.base }}
          head: ${{ steps.scan-range.outputs.head }}
          extra_args: --results=verified,unknown

  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Verify all third-party actions are pinned to a 40-char SHA
        run: |
          set -eo pipefail
          # `@(v?[0-9]|main|master)` also matches a real 40-char SHA that
          # happens to start with a decimal digit (e.g. `@76071ef0...`),
          # producing false positives — confirmed via a real CI run.
          # Extract each `uses:` ref and reject only refs that are NOT a
          # full 40-char hex SHA.
          bad=$(grep -RhnoE '^\s*uses:\s*[^@]+@[^[:space:]]+' .github/ .gitea/ .forgejo/ 2>/dev/null \
                | grep -vE '@[0-9a-fA-F]{40}$' || true)
          if [[ -n "$bad" ]]; then
            echo "::error::Unpinned actions found (must be 40-char SHAs):"
            echo "$bad"
            exit 1
          fi

  vuln-scan:
    needs: detect
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.has_cargo_lock == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: cargo audit (inside casjaysdev/rust:latest)
        # `casjaysdev/rust:latest`'s default ENTRYPOINT intercepts ad hoc
        # `docker run` invocations unless explicitly overridden — see the
        # identical fix and rationale in the license-compliance job above.
        run: |
          IMAGE="casjaysdev/rust:latest"
          docker run --rm -i \
            --name "$(basename "$GITHUB_REPOSITORY")-$(tr -dc 'a-z0-9' </dev/urandom | head -c8)" \
            --entrypoint sh \
            -v "$PWD":/work -w /work "$IMAGE" -c 'cargo audit'

  image-scan:
    needs: detect
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.has_dockerfile == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - name: Build local image for scanning
        run: |
          docker build -f docker/Dockerfile -t scan-target:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: scan-target:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
