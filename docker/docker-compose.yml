services:
  cashttpd:
    image: ghcr.io/casapps/cashttpd:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PROJECT_ORG: casapps
        PROJECT_NAME: cashttpd
    ports:
      - "127.0.0.1:59123:59123"
    volumes:
      - ../:/srv/www:ro
    command: ["serve", "--listen", "::1", "--port", "59123", "--dir", "/srv/www"]
