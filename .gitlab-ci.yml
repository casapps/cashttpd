stages:
  - build
  - test
  - security
  - release

default:
  image: casjaysdev/rust:latest

lint:
  stage: build
  script:
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --all-features -- -D warnings

test:
  stage: test
  script:
    - cargo test --workspace --all-features

coverage:
  stage: test
  script:
    # IDEA.md does not declare a coverage threshold, so the PART 8 default
    # of 60% applies. Using `cargo llvm-cov` rather than `cargo tarpaulin`
    # — both are pre-installed in casjaysdev/rust:latest and AI.md PART 8
    # permits either, but tarpaulin's ptrace-based instrumentation needs to
    # disable ASLR via `personality()`, which fails with EPERM inside a
    # containerized CI job (confirmed on GitHub Actions; llvm-cov avoids the
    # risk entirely via source-based instrumentation, kept consistent here).
    - cargo llvm-cov --workspace --all-features --fail-under-lines 60

docs:
  stage: test
  script:
    - cargo doc --workspace --no-deps

license-compliance:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  script:
    # `casjaysdev/rust:latest` ships a default ENTRYPOINT (an unrelated
    # SMTP-config startup script) that silently intercepts any ad hoc
    # `docker run` that doesn't explicitly override it — confirmed via a
    # real GitHub Actions CI run. `--entrypoint sh -c '...'` bypasses it.
    - docker run --rm --entrypoint sh -v "$PWD":/work -w /work casjaysdev/rust:latest -c 'cargo deny check licenses advisories bans sources'
    # `cargo-about` is not part of casjaysdev/rust:latest (verified directly
    # against the image), so this builds the local extension image
    # (docker/Dockerfile.build) to run the attribution-drift check.
    - docker build -f docker/Dockerfile.build -t "$CI_REGISTRY_IMAGE/toolchain:ci" .
    - docker run --rm --entrypoint sh -v "$PWD":/work -w /work "$CI_REGISTRY_IMAGE/toolchain:ci" -c 'cargo about generate about.hbs' > LICENSE.generated.md
    - sed -n '/<!-- GENERATED:/,$p' LICENSE.md > LICENSE.committed-generated.md
    - diff LICENSE.committed-generated.md LICENSE.generated.md

build:
  stage: build
  script:
    - cargo build --release

secret-scan:
  stage: security
  image: trufflesecurity/trufflehog:latest
  variables:
    GIT_DEPTH: 0
  script:
    - trufflehog git file://. --since-commit "$CI_COMMIT_BEFORE_SHA" --to-commit "$CI_COMMIT_SHA" --only-verified --fail

workflow-policy:
  stage: security
  script:
    - set -eo pipefail
    # `@(v?[0-9]|main|master)` also matches a real 40-char SHA that happens to
    # start with a decimal digit (e.g. `@76071ef0...`), producing false
    # positives — confirmed via a real CI run. Extract each `uses:` ref and
    # reject only refs that are NOT a full 40-char hex SHA.
    - 'bad=$(grep -RhnoE "^\s*uses:\s*[^@]+@[^[:space:]]+" .github/ .gitea/ .forgejo/ 2>/dev/null | grep -vE "@[0-9a-fA-F]{40}$" || true)'
    - |
      if [[ -n "$bad" ]]; then
        echo "Unpinned actions found (must be 40-char SHAs):"
        echo "$bad"
        exit 1
      fi

vuln-scan:
  stage: security
  image: docker:latest
  services:
    - docker:dind
  rules:
    - exists:
        - Cargo.lock
  script:
    # Same default-ENTRYPOINT interception issue as license-compliance above.
    - docker run --rm --entrypoint sh -v "$PWD":/work -w /work casjaysdev/rust:latest -c 'cargo audit'

image-scan:
  stage: security
  image: aquasec/trivy:0.70.0
  rules:
    - exists:
        - docker/Dockerfile
  services:
    - docker:dind
  script:
    - docker build -f docker/Dockerfile -t "$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:scan" .
    - trivy image --severity CRITICAL,HIGH --exit-code 1 "$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:scan"

release-build:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  parallel:
    matrix:
      - TARGET:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-gnullvm
          - x86_64-apple-darwin
          - aarch64-apple-darwin
  script:
    - set -euo pipefail
    - cargo build --release --target "$TARGET"
    - mkdir -p binaries
    - |
      case "$TARGET" in
        x86_64-unknown-linux-musl)  ARTIFACT="cashttpd-linux-amd64" ;;
        aarch64-unknown-linux-musl) ARTIFACT="cashttpd-linux-arm64" ;;
        x86_64-pc-windows-gnu)      ARTIFACT="cashttpd-windows-amd64.exe" ;;
        aarch64-pc-windows-gnullvm) ARTIFACT="cashttpd-windows-arm64.exe" ;;
        x86_64-apple-darwin)        ARTIFACT="cashttpd-darwin-amd64" ;;
        aarch64-apple-darwin)       ARTIFACT="cashttpd-darwin-arm64" ;;
      esac
    - |
      case "$TARGET" in
        *-pc-windows-*) BIN="cashttpd.exe" ;;
        *)              BIN="cashttpd" ;;
      esac
    - cp "target/$TARGET/release/$BIN" "binaries/$ARTIFACT"
    - sha256sum "binaries/$ARTIFACT" > "binaries/$ARTIFACT.sha256"
  artifacts:
    paths:
      - binaries/
    expire_in: 30 days

release-sbom:
  stage: release
  needs:
    - release-build
  rules:
    - if: '$CI_COMMIT_TAG'
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -f docker/Dockerfile.build -t "$CI_REGISTRY_IMAGE/toolchain:release" .
    # toolchain:release is FROM casjaysdev/rust:latest — same ENTRYPOINT fix.
    - docker run --rm --entrypoint sh -v "$PWD":/work -w /work "$CI_REGISTRY_IMAGE/toolchain:release" -c 'cargo cyclonedx --format json'
    - cp bom.json "binaries/cashttpd-bom.json"
  artifacts:
    paths:
      - binaries/

release-publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - release-build
    - release-sbom
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Publishing release $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
