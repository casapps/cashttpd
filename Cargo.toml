[workspace]
members = ["xtask"]

[package]
name         = "cashttpd"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.85"
license      = "MIT"
authors      = ["casapps"]
repository   = "https://github.com/casapps/cashttpd"
homepage     = "https://github.com/casapps/cashttpd"
description  = "RFC-compliant local-development HTTP/HTTPS server with .htaccess/.htpasswd, CGI, multi-language scripting, and dev-framework proxying"

[[bin]]
name = "cashttpd"
path = "src/main.rs"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[dependencies]
signal-hook = "0.3"
nix         = { version = "0.29", features = ["user", "signal"] }
# CLI-style surface's flag parsing (`uis::cli`) — builder API (not
# `features = ["derive"]`) gives `--help`/`-h` and usage/error text for free
# instead of hand-rolling `std::env::args()` scanning. The derive feature is
# deliberately avoided: its proc-macro crate type cannot be produced on this
# project's musl-hosted, `+crt-static`-linked `casjaysdev/rust:latest`
# toolchain (confirmed directly: "cannot produce proc-macro for ... as the
# target x86_64-unknown-linux-musl does not support these crate types"),
# matching this codebase's existing proc-macro-avoidance precedent
# documented below for the TLS/ACME dependencies.
clap = "4"
# `config/mod.rs` parses/emits YAML via `serde_yaml::Value` directly
# instead of `#[derive(Deserialize)]` — the config schema's layered
# CLI/env/per-project/global/built-in merge doesn't map cleanly onto a
# single derived struct, not a toolchain limitation (proc-macro crates do
# build fine under `casjaysdev/rust:latest`, verified directly).
serde_yaml = "0.9"
mime_guess = "2"
# `.htpasswd` hash verification (IDEA.md ".htaccess"/".htpasswd"
# compatibility") — bcrypt for `$2y$`/`$2a$`/`$2b$`, `md-5` as the digest
# primitive for the custom apr1/md5-crypt loop, `sha1` + `base64` for the
# legacy `{SHA}` format. All pure Rust (PART 5 "Pure-Rust Library Stack" —
# RustCrypto family); crypt-DES and other legacy formats are out of scope
# (documented gap in TODO.AI.md).
bcrypt = "0.15"
md-5   = "0.10"
sha1   = "0.10"
base64 = "0.22"
# `RewriteRule`/`RewriteCond`/`RedirectMatch` pattern matching (IDEA.md
# ".htaccess" `mod_rewrite`/`mod_alias` semantics).
regex = "1"
# TLS certificate resolution (IDEA.md "TLS certificate resolution"): `rustls`
# terminates HTTPS and (as a client) drives the ACME v2 HTTPS calls (PART 5
# "Pure-Rust Library Stack" — TLS row); `webpki-roots` supplies the Mozilla
# root store `rustls` needs to verify Let's Encrypt's own TLS certificate
# when this server acts as an ACME client; `rustls-pki-types` (the `pem`
# object API, `alloc` feature) parses PEM cert/key files directly — used
# instead of `rustls-pemfile`, which RUSTSEC-2025-0134 flags unmaintained
# (its own upstream advisory recommends depending on `rustls-pki-types`
# directly, since the latest `rustls-pemfile` release was already a thin
# wrapper around the same code); `rcgen` generates self-signed certs and
# ACME CSRs (pure Rust, uses `ring` internally — pre-granted per PART 5);
# `ring` signs the ACME account/JWS requests (ECDSA P-256); `serde_json`
# encodes/decodes ACME JSON payloads.
#
# The ACME v2 (RFC 8555) HTTP-01 flow's own HTTP/1.1 request/response
# framing is hand-rolled directly on `rustls::ClientConnection` + `TcpStream`
# (`servers::tls`) rather than using a general-purpose HTTP client crate
# (`ureq`/`reqwest`): both pull in the `url` crate and its `idna` ->
# `idna_adapter` -> `icu_*` chain for a flow that only ever talks to one
# already-known ACME directory URL, and the whole exchange runs once at
# startup, synchronously, before any listener is bound. Likewise,
# validity-date extraction from Let's-Encrypt-live host certificates needs
# only a narrow, well-specified DER walk. Both are hand-rolled rather than
# adding a dependency — matching this codebase's existing precedent
# (`apr1_crypt`, the `mod_rewrite` engine) of implementing bounded protocol
# logic directly when the alternative is a heavyweight dependency for a
# single call site.
#
# Proc-macro note, re-verified directly against `casjaysdev/rust:latest`
# (host triple `x86_64-unknown-linux-musl`): proc-macro crates build here
# only when the target triple is named explicitly. `.cargo/config.toml`
# attaches `-C target-feature=+crt-static` to the musl targets, and a bare
# `cargo build` — where the requested target *is* the host target — applies
# those rustflags to host build artifacts too, which makes a proc-macro
# (a dynamic library by definition) impossible to produce and fails with
# "cannot produce proc-macro ... as the target does not support these crate
# types". Passing `--target` (the Makefile exports `CARGO_BUILD_TARGET` for
# exactly this reason) keeps target rustflags off host units, so
# `proc-macro2`/`quote`/`syn`/`thiserror-impl`/`tokio-macros` compile
# normally while the shipped binary stays statically linked. That is what
# makes the tokio/hyper/quinn stack below buildable here. `clap`'s `derive`
# feature is a separate, genuine crate-type conflict, documented at its own
# entry above.
rustls          = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", default-features = false, features = ["alloc"] }
webpki-roots    = "1"
rcgen           = "0.13"
ring            = "0.17"
serde_json      = "1"
# Self-signed cert validity window (`server::tls::generate_self_signed`) —
# the non-macro subset already pulled transitively by `rcgen`, used
# directly rather than hand-rolling yet another date type. Pinned >=0.3.47:
# RUSTSEC-2026-0009 (stack exhaustion parsing malicious RFC 2822 input) is
# fixed from 0.3.47 onward.
time            = "0.3.47"
# Protocol version negotiation (IDEA.md "Core behavior" → "Protocol version
# negotiation"): HTTP/1.1 + HTTP/2 over one TCP listener, HTTP/3 over QUIC on
# the same port number when TLS is on. This is what makes the listener async
# — HTTP/2 multiplexes concurrent streams onto one connection and HTTP/3 is
# inherently multiplexed, neither of which the previous thread-per-connection
# blocking `std::net::TcpStream` model can express.
#
# `tokio` is the async runtime PART 5 "Pure-Rust Library Stack" names for
# this capability ("Async runtime" and "Networking primitives" rows). Only
# the features this server actually uses are enabled — no `default-features`
# blanket pull-in: `rt-multi-thread` (the runtime itself), `net`
# (TcpListener/TcpStream/UdpSocket), `fs` (static-file reads off the reactor
# threads), `io-util` (AsyncRead/AsyncWriteExt, `copy_bidirectional` for
# WebSocket relay), `process` (CGI/script subprocesses without blocking a
# worker), `time` (accept-loop poll interval, HTTP/2 keep-alive timers),
# `sync`, and `macros` (`tokio::select!` in the accept loop).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "fs", "io-util", "process", "time", "sync", "macros"] }
# `hyper` provides the RFC 9112 (HTTP/1.1) and RFC 9113 (HTTP/2) server
# framing this project previously hand-rolled, plus the HTTP/1.1 client
# framing the framework dev-server proxy needs upstream. `hyper-util`'s
# `server-auto` builder is what serves both versions off the same cleartext
# TCP listener: it sniffs the RFC 9113 §3.4 HTTP/2 connection preface and
# switches to HTTP/2, otherwise stays on HTTP/1.1 — i.e. prior-knowledge h2c,
# with no separate port and no client hint required. `http-body-util` supplies
# the `Full`/`BoxBody` body adapters both sides are written against.
hyper = { version = "1", default-features = false, features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
# `http` types (`Request`/`Response`/`HeaderMap`/`StatusCode`) are named
# directly across `servers::{mod,proxy,http3}`; depending on it explicitly
# rather than via `hyper::http` keeps the HTTP/3 path — which uses `h3`, not
# hyper — on the exact same version.
http  = "1"
bytes = "1"
# TLS ALPN termination for the TCP listener (IDEA.md: `http/1.1` and `h2`
# negotiated over the one `--port` listener). `tokio-rustls` is the async
# acceptor around the same `rustls` 0.23 `ServerConfig` built by
# `servers::tls`, with the same `ring` provider and no `default-features` —
# PART 9 "Security-First Design" mandates `rustls`, never OpenSSL/GnuTLS.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# HTTP/3 (RFC 9114) over QUIC (RFC 9000), served on a UDP listener bound to
# the same port number as the TCP listener and advertised via `Alt-Svc`.
# `quinn` is the pure-Rust QUIC implementation (tokio runtime + the same
# `ring` rustls provider, so no second crypto backend enters the tree); `h3`
# implements HTTP/3 request/response framing and QPACK on top of a QUIC
# transport, and `h3-quinn` is the glue between the two. QUIC mandates TLS
# 1.3, which is why this path exists only when `tls.enabled: true`.
quinn    = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3       = "0.0.8"
h3-quinn = "0.0.10"
# Response compression (IDEA.md "Response compression"): `br` then `gzip`,
# negotiated from `Accept-Encoding`. Both crates are pure Rust — `flate2` is
# pinned to `default-features = false` + `rust_backend` (miniz_oxide) rather
# than its default `libz-sys` backend, which would link system zlib and break
# the single-static-binary rule (PART 5 "Pure-Rust Library Stack" —
# Compression row names exactly this pairing); `brotli` is pure Rust with no
# `*-sys` dependency at all, and its `std` feature is the only one enabled.
# Zstd is deliberately not offered: the Compression row notes there is no
# pure-Rust zstd *encoder*, and `zstd`/`zstd-safe` vendors C, which would
# need an IDEA.md exception for an encoding no browser advertises by default.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = { version = "7", default-features = false, features = ["std"] }
