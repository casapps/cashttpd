[workspace]
members = ["xtask"]

[package]
name         = "cashttpd"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT"
authors      = ["casapps"]
repository   = "https://github.com/casapps/cashttpd"
homepage     = "https://github.com/casapps/cashttpd"
description  = "RFC-compliant local-development HTTP/HTTPS server with .htaccess/.htpasswd, CGI, multi-language scripting, and dev-framework proxying"

[[bin]]
name = "cashttpd"
path = "src/main.rs"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[dependencies]
signal-hook = "0.3"
nix         = { version = "0.29", features = ["user", "signal"] }
# `config/mod.rs` parses/emits YAML via `serde_yaml::Value` directly
# instead of `#[derive(Deserialize)]` — the config schema's layered
# CLI/env/per-project/global/built-in merge doesn't map cleanly onto a
# single derived struct, not a toolchain limitation (proc-macro crates do
# build fine under `casjaysdev/rust:latest`, verified directly).
serde_yaml = "0.9"
mime_guess = "2"
# `.htpasswd` hash verification (IDEA.md ".htaccess"/".htpasswd"
# compatibility") — bcrypt for `$2y$`/`$2a$`/`$2b$`, `md-5` as the digest
# primitive for the custom apr1/md5-crypt loop, `sha1` + `base64` for the
# legacy `{SHA}` format. All pure Rust (PART 5 "Pure-Rust Library Stack" —
# RustCrypto family); crypt-DES and other legacy formats are out of scope
# (documented gap in TODO.AI.md).
bcrypt = "0.15"
md-5   = "0.10"
sha1   = "0.10"
base64 = "0.22"
# `RewriteRule`/`RewriteCond`/`RedirectMatch` pattern matching (IDEA.md
# ".htaccess" `mod_rewrite`/`mod_alias` semantics).
regex = "1"
