[workspace]
members = ["xtask"]

[package]
name         = "cashttpd"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT"
authors      = ["casapps"]
repository   = "https://github.com/casapps/cashttpd"
homepage     = "https://github.com/casapps/cashttpd"
description  = "RFC-compliant local-development HTTP/HTTPS server with .htaccess/.htpasswd, CGI, multi-language scripting, and dev-framework proxying"

[[bin]]
name = "cashttpd"
path = "src/main.rs"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"

[dependencies]
signal-hook = "0.3"
nix         = { version = "0.29", features = ["user", "signal"] }
# NOTE: no `derive` feature — this toolchain's host target
# (x86_64-unknown-linux-musl, per `casjaysdev/rust:latest`) cannot build
# proc-macro crate types ("cannot produce proc-macro for `serde_derive`...
# does not support these crate types"), so `config/mod.rs` parses/emits
# YAML via `serde_yaml::Value` directly instead of `#[derive(Deserialize)]`.
serde_yaml = "0.9"
mime_guess = "2"
